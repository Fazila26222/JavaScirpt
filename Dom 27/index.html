<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <h1>Product Management</h1>
        <div class="controls">
            <button id="removeBtn">
                Remove Last Product
            </button>
            <button id="removeChildBtn">
                Remove First Product
            </button>
            <button id="replaceBtn">
                Replece First Product
            </button>
            <button id="cloneBtn">
                Colen Last Product
            </button>
        </div>
        <div class="products" id="productList">
            <div class="product">
                <h3>Laptop</h3>
                <p>Price: $800</p>
            </div>
            <div class="product">
                <h3>Smartphone</h3>
                <p>Price: $500</p>
            </div>
            <div class="product">
                <h3>Headphones</h3>
                <p>Price: $100</p>
            </div>
        </div>
    </div>
</body>
<script src="js/js.js"></script>

</html>
